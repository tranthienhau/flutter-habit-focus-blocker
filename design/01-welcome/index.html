<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anchor - Welcome Onboarding</title>
<!-- Tailwind CSS v3 CDN with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&amp;display=swap" rel="stylesheet"/>
<!-- END: Google Fonts -->
<!-- BEGIN: Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aubergine: {
              DEFAULT: '#4A154B',
              dark: '#3F1240',
              gradientEnd: '#6B2A5E',
              tint: '#E6DEE6',
              surface: '#F7EEF7'
            },
            gold: {
              DEFAULT: '#ECB22E',
            },
            anchorText: {
              primary: '#1E0C1F',
              secondary: '#5E4A5F',
              tertiary: '#8F7D90'
            }
          },
          fontFamily: {
            display: ['Gloock', 'serif'],
            sans: ['Lato', 'sans-serif'],
          },
          boxShadow: {
            'soft-elevation': '0 8px 24px rgba(30, 12, 31, 0.12), 0 2px 6px rgba(30, 12, 31, 0.08)',
          }
        }
      }
    }
  </script>
<!-- END: Tailwind Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-layout">
    /* iOS frame viewport lock for realistic 393x852 presentation */
    body {
      background-color: #1a0f1b;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Lato', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .iphone-canvas {
      width: 393px;
      height: 852px;
      position: relative;
      overflow: hidden;
      border-radius: 54px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
      background-color: #4A154B;
    }

    /* Ambient radial glow under the aubergine gradient for warmth */
    .golden-ambient-glow {
      position: absolute;
      width: 300px;
      height: 240px;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(236, 178, 46, 0.15) 0%, rgba(107, 42, 94, 0) 70%);
      pointer-events: none;
      z-index: 15;
    }

    /* Smooth layered image gradient fade */
    .hero-overlay-gradient {
      background: linear-gradient(
        180deg, 
        rgba(30, 12, 31, 0.28) 0%, 
        rgba(30, 12, 31, 0.05) 28%,
        rgba(74, 21, 75, 0.45) 48%, 
        #4A154B 72%, 
        #411142 100%
      );
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body>
<!-- BEGIN: PhoneFrame -->
<main class="iphone-canvas relative flex flex-col justify-between select-none" data-purpose="mobile-screen-container">
<!-- BEGIN: BackgroundImageAndOverlay -->
<div class="absolute inset-0 z-0 overflow-hidden" data-purpose="hero-imagery">
<!-- High-resolution authentic lifestyle photograph -->
<img alt="Calm morning desk with notebook, face-down phone and warm coffee" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCS9nvcgj_vWMnvMRxfwgfElpbANSeTNaiYaaf1OjEpv_ZTPFceRsV_Qadk_s3isYNVZkuQ3EWv6DKM093qMQ3HAojk9oC_1uq77BFXNVp-dVHyAUV_zIwSrKDxhmeigivv8a6qkXktGAX2YelLdqiItkETIbaK6cG0Sz3nKvIe1fVT9PeVVsAHTP9OLArTkMoEM5c4ibkNMvqPM4gcTSzQVCo2DZMM4qX1ip2GXuCrPFhyZOSTWclFlHgOlPO1kF6itJfvONV1G4o"/>
<!-- Rich Aubergine to Deep Plum vignette overlay -->
<div class="absolute inset-0 hero-overlay-gradient"></div>
<!-- Ambient warm gold glow -->
<div class="golden-ambient-glow"></div>
</div>
<!-- END: BackgroundImageAndOverlay -->
<!-- BEGIN: HeaderSection -->
<header class="relative z-20 w-full pt-[14px] px-7" data-purpose="status-and-topbar">
<!-- Status Bar Area (iOS standard 9:41) -->
<div class="flex justify-between items-center h-[26px] text-white tracking-tight" data-purpose="ios-status-bar">
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Status Icons: Cellular, Wi-Fi, Battery -->
<div class="flex items-center space-x-[6px]">
<!-- Cellular Icon -->
<svg aria-label="Cellular connection" class="w-4 h-3.5 fill-current" fill="none" viewbox="0 0 17 11" xmlns="http://www.w3.org/2000/svg">
<rect height="3" rx="0.75" width="2.5" x="0" y="8"></rect>
<rect height="5" rx="0.75" width="2.5" x="4" y="6"></rect>
<rect height="7.5" rx="0.75" width="2.5" x="8" y="3.5"></rect>
<rect height="10" rx="0.75" width="2.5" x="12" y="1"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg aria-label="Wi-Fi" class="w-3.5 h-3.5 fill-current" fill="none" viewbox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
<path d="M8 9.5C8.82843 9.5 9.5 10.1716 9.5 11C9.5 11.8284 8.82843 12.5 8 12.5C7.17157 12.5 6.5 11.8284 6.5 11C6.5 10.1716 7.17157 9.5 8 9.5ZM8 5.5C10.2222 5.5 12.2222 6.4 13.6569 7.82843L12.2426 9.24264C11.1569 8.15685 9.65685 7.5 8 7.5C6.34315 7.5 4.84315 8.15685 3.75736 9.24264L2.34315 7.82843C3.77778 6.4 5.77778 5.5 8 5.5ZM8 1.5C11.3137 1.5 14.3137 2.84315 16.4853 5.01472L15.0711 6.42893C13.2574 4.61522 10.7574 3.5 8 3.5C5.24264 3.5 2.74264 4.61522 0.928932 6.42893L-0.485281 5.01472C1.68629 2.84315 4.68629 1.5 8 1.5Z"></path>
</svg>
<!-- Battery Icon with Level -->
<div aria-label="100% Battery" class="flex items-center">
<div class="w-[22px] h-[11.5px] border border-white/80 rounded-[3.5px] p-[1.5px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-[4px] bg-white/80 rounded-r-sm ml-[1px]"></div>
</div>
</div>
</div>
<!-- App Branding Navigation Bar -->
<nav aria-label="Onboarding header" class="flex items-center justify-between pt-5 pb-2">
<!-- Logo / Brand Identifier -->
<div class="flex items-center space-x-2 text-white">
<div class="w-8 h-8 rounded-full bg-white/10 backdrop-blur-md border border-white/15 flex items-center justify-center text-[#ECB22E]">
<!-- Authentic Lucide-style Anchor Icon (1.75 stroke) -->
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<circle cx="12" cy="5" r="3"></circle>
<line x1="12" x2="12" y1="22" y2="8"></line>
<path d="M5 12H2a10 10 0 0 0 20 0h-3"></path>
</svg>
</div>
<span class="text-[17px] font-bold tracking-tight text-white drop-shadow-sm">Anchor</span>
</div>
<!-- Skip Action -->
<button class="text-white/80 hover:text-white transition-colors duration-200 text-[14px] font-medium tracking-wide py-1 px-2.5 rounded-full hover:bg-white/10 active:scale-95" data-purpose="skip-onboarding-button" type="button">
          Skip
        </button>
</nav>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: BottomContentSection -->
<section class="relative z-20 px-6 pb-9 flex flex-col justify-end w-full" data-purpose="onboarding-main-content">
<!-- Pagination Dots (Screen 1 of 3) -->
<div aria-label="Step 1 of 3" class="flex items-center space-x-2 mb-6" data-purpose="pagination-indicator">
<!-- Dot 1 (Active): Warm Gold Pill -->
<span class="w-7 h-[6px] bg-[#ECB22E] rounded-full shadow-[0_0_12px_rgba(236,178,46,0.5)] transition-all duration-300"></span>
<!-- Dot 2 (Inactive) -->
<span class="w-[6px] h-[6px] bg-white/40 rounded-full"></span>
<!-- Dot 3 (Inactive) -->
<span class="w-[6px] h-[6px] bg-white/40 rounded-full"></span>
</div>
<!-- Hero Headline (Gloock Serif Font) -->
<h1 class="font-display text-[34px] leading-[1.12] text-white tracking-[-0.02em] font-normal mb-3 text-balance">
        Build habits.<br/>
        Guard your focus.
      </h1>
<!-- Supporting Body Copy (Lato Font) -->
<p class="font-sans text-[16px] leading-[1.4] text-[#E6DEE6] font-normal mb-8 max-w-[320px]">
        Track streaks, block distracting apps, and do your best work every single morning.
      </p>
<!-- CTA Action Group -->
<div class="flex flex-col items-center w-full space-y-3.5" data-purpose="button-actions">
<!-- Primary Action Button: Pill, White Surface with Aubergine Label -->
<button class="w-full h-14 rounded-full bg-white active:bg-[#F7EEF7] text-[#4A154B] text-[16px] font-semibold tracking-normal flex items-center justify-center space-x-2 shadow-soft-elevation transform active:scale-[0.985] transition-all duration-150" data-purpose="get-started-cta" type="button">
<span>Get started</span>
<!-- Subtle forward chevron icon -->
<svg class="w-4 h-4 ml-0.5 text-[#4A154B]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- Secondary Action: Login Text Link -->
<button class="py-2.5 px-4 text-[14px] font-medium text-[#E6DEE6] hover:text-white transition-colors duration-150 active:opacity-75 focus:outline-none" data-purpose="login-link" type="button">
          I already have an account
        </button>
</div>
<!-- iOS Home Indicator Safe Area Spacer -->
<div class="w-full pt-4 flex justify-center items-center" data-purpose="ios-home-indicator">
<div class="w-[134px] h-[5px] bg-white/40 rounded-full"></div>
</div>
</section>
<!-- END: BottomContentSection -->
</main>
<!-- END: PhoneFrame -->
<!-- BEGIN: Interactive Feedback Script -->
<script data-purpose="haptic-and-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const getStartedBtn = document.querySelector('[data-purpose="get-started-cta"]');
      const skipBtn = document.querySelector('[data-purpose="skip-onboarding-button"]');
      const loginBtn = document.querySelector('[data-purpose="login-link"]');

      if (getStartedBtn) {
        getStartedBtn.addEventListener('click', () => {
          // Micro-interaction placeholder for screen 2 progression
          getStartedBtn.classList.add('opacity-90');
          setTimeout(() => {
            getStartedBtn.classList.remove('opacity-90');
          }, 150);
        });
      }

      if (skipBtn) {
        skipBtn.addEventListener('click', () => {
          console.log('User tapped Skip Onboarding');
        });
      }

      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          console.log('User tapped Existing Account');
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Script -->
</body></html>
