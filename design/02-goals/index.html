<body class="bg-[#2D1B2E] text-text-primary min-h-screen flex items-center justify-center p-0 md:p-6 antialiased selection:bg-primary-container selection:text-white">
<!-- iPhone Viewport Shell (393px × 852px) -->
<main class="w-full max-w-[393px] h-[852px] bg-background relative flex flex-col justify-between overflow-hidden shadow-2xl md:rounded-[52px] border-0 md:border-[10px] md:border-[#1E0C1F]/15">

<span class="font-body text-[15px] font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-2 text-text-primary">
<span class="material-symbols-outlined text-[17px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[20px]">battery_full</span>
</div>
</header>
<!-- Navigation Header (Step 2 of 4 from Shared Components JSON + Progress Bar) -->

<div class="flex justify-between items-center w-full h-12">
<!-- Back Button -->
<button aria-label="Go back" class="w-9 h-9 flex items-center justify-center rounded-full hover:opacity-80 active:scale-95 transition-all text-text-primary -ml-1" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_back_ios_new">arrow_back_ios_new</span>
</button>
<!-- Segmented/Continuous Progress Track -->
<div class="flex-1 mx-4 max-w-[150px]">
<div class="w-full h-1 bg-border rounded-full overflow-hidden">
<div class="w-1/2 h-full bg-primary-container rounded-full transition-all duration-300"></div>
</div>
</div>
<!-- Trailing Skip Action -->
<button class="font-body text-body font-normal text-text-secondary hover:opacity-80 active:scale-95 transition-opacity px-1" type="button">
          Skip
        </button>
</div>
<!-- Step Counter Headline -->
<div class="w-full text-center mt-[-6px]">
<span class="font-caption text-caption text-text-tertiary font-semibold tracking-wider uppercase">Step 2 of 4</span>
</div>
</section>
<!-- Scrollable Content Canvas -->
<div class="flex-1 px-margin overflow-y-auto no-scrollbar pb-6 z-10 flex flex-col">
<!-- Typography Header -->
<header class="pt-2 pb-5">
<h1 class="font-display text-display text-text-primary leading-tight">

<p class="font-body text-body text-text-secondary mt-2">

        </p>
</header>
