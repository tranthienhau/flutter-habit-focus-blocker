<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .custom-shadow {
      box-shadow: 0 1px 2px rgba(30,12,31,0.04), 0 8px 24px rgba(30,12,31,0.06);
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-text-primary min-h-screen flex justify-center selection:bg-accent-tint">
<!-- iPhone Container: 393px × 852px Viewport Wrapper -->
<div class="relative w-full max-w-[393px] min-h-[852px] bg-background flex flex-col justify-between overflow-x-hidden pb-[95px]">
<!-- iOS Native Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center text-text-primary select-none z-30">
<span class="font-label text-[15px] font-semibold tracking-tight text-text-primary">9:41</span>
<div class="flex items-center space-x-1.5 text-text-primary">
<span class="material-symbols-outlined !text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined !text-[17px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined !text-[19px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- App Top Navigation Header -->
<div class="flex justify-between items-center px-margin pt-4 pb-2">
<div class="w-10 flex items-center">
<!-- Leading slot / Balance spacer -->
<button aria-label="History" class="w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-text-secondary" data-icon="history">history</span>
</button>
</div>
<h1 class="font-display text-display text-text-primary tracking-tight text-center">Focus</h1>
<div class="w-10 flex items-center justify-end">
<button aria-label="Settings" class="w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-text-secondary" data-icon="notifications_none">notifications_none</span>
</button>
</div>
</div>
<!-- Main Content Flow -->
<main class="flex-1 flex flex-col justify-start px-margin">
<!-- Segmented Control: Timer vs Stopwatch -->
<section class="mt-2 mb-6 flex justify-center">
<div class="bg-surface-alt border border-border p-1 flex rounded-full max-w-[240px] w-full shadow-inner select-none">
<button class="flex-1 bg-primary-container text-surface font-label text-label font-semibold rounded-full py-1.5 text-center shadow-sm transition-all duration-200" id="mode-timer">
            Timer
          </button>
<button class="flex-1 text-text-secondary font-label text-label font-medium rounded-full py-1.5 text-center hover:text-text-primary transition-all duration-200" id="mode-stopwatch">
            Stopwatch
          </button>
</div>
</section>
<!-- Centerpiece: Circular Timer Dial (~240px) -->
<div class="relative w-[240px] h-[240px] mx-auto flex items-center justify-center my-1 select-none">
<!-- SVG Progress Ring -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 240 240">
<!-- Background Track -->
<circle cx="120" cy="120" fill="transparent" r="104" stroke="#E6DEE6" stroke-linecap="round" stroke-width="8"></circle>
<!-- Active Gold Progress Track (~75% complete presentation) -->
<circle class="transition-all duration-500 ease-out" cx="120" cy="120" fill="transparent" r="104" stroke="#ffc23e" stroke-dasharray="653.45" stroke-dashoffset="180" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Inner Content Stack -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-display text-[52px] leading-none font-bold text-primary-container tracking-tight mt-1">
            25:00
          </span>
<!-- Category Chip -->
<button class="mt-3.5 bg-surface-alt hover:bg-accent-tint border border-border/80 text-primary-container text-caption font-caption px-3 py-1 rounded-full flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
<span class="text-text-primary font-medium">Deep work</span>
<span class="material-symbols-outlined !text-[13px] text-primary-container" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- Duration Selector Chips Row -->
<section class="flex justify-center items-center gap-2.5 my-6">
<button class="bg-surface border border-border text-text-secondary hover:border-text-tertiary px-4 py-2 font-label text-label font-medium rounded-full active:scale-95 transition-all duration-150">
          15m
        </button>
<button class="bg-primary-container text-surface px-4 py-2 font-label text-label font-semibold rounded-full shadow-sm active:scale-95 transition-all duration-150 ring-2 ring-primary-container/10">
          25m
        </button>
<button class="bg-surface border border-border text-text-secondary hover:border-text-tertiary px-4 py-2 font-label text-label font-medium rounded-full active:scale-95 transition-all duration-150">
          50m
        </button>
<button class="bg-surface border border-border text-text-secondary hover:border-text-tertiary px-4 py-2 font-label text-label font-medium rounded-full active:scale-95 transition-all duration-150">
          90m
        </button>
</section>
<!-- App Blocking Card (Tactile iOS Container) -->
<div class="bg-surface rounded-[20px] p-4 custom-shadow border border-border/60 mb-6 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-surface-alt rounded-xl p-2.5 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary-container !text-[22px]" data-icon="shield">shield</span>
</div>
<div class="flex flex-col text-left">
<span class="font-title text-[14px] leading-tight font-semibold text-text-primary">
              Block distracting apps during session
            </span>
<span class="font-caption text-caption text-text-secondary mt-0.5">
              Social, Games and 4 apps
            </span>
</div>
</div>
<!-- iOS Style Switch Toggle -->
<label class="relative inline-flex items-center cursor-pointer select-none flex-shrink-0 ml-2">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-12 h-7 bg-accent-tint peer-focus:outline-none rounded-full peer peer-checked:bg-primary-container transition-colors duration-200 ease-in-out"></div>
<div class="absolute left-1 top-1 bg-surface w-5 h-5 rounded-full shadow-sm transition-transform duration-200 ease-in-out peer-checked:translate-x-5"></div>
</label>
</div>
<!-- Action Section: Start Focus & Daily Metric -->
<section class="flex flex-col items-center w-full">
<button class="w-full bg-primary-container hover:bg-accent-pressed active:scale-[0.98] text-surface font-title text-body font-semibold py-4 rounded-full shadow-md text-center flex items-center justify-center gap-2 px-6 transition-all duration-150">
<span class="material-symbols-outlined !text-[20px]" data-icon="play_arrow">play_arrow</span>
<span>Start focus</span>
</button>
<span class="font-caption text-caption text-text-secondary mt-3 tracking-normal">
          2h 10m focused today
        </span>
</section>
</main>
<!-- Bottom Tab Bar (Strict Shared Components Execution: Exactly 5 items) -->
<!-- Destination Rule: Focus is active tab with gold indicator dot and bold aubergine styling -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin pt-space-xs pb-space-xl max-w-[393px] mx-auto bg-surface border-t border-border/80">
<!-- Tab 1: Today -->
<a class="flex flex-col items-center justify-center text-text-tertiary pt-2.5 hover:opacity-80 transition-opacity duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
<span class="font-caption text-caption mt-1">Today</span>
</a>
<!-- Tab 2: Focus (ACTIVE) -->
<a class="flex flex-col items-center justify-center text-primary-container relative before:content-[''] before:w-1.5 before:h-1.5 before:bg-secondary-container before:rounded-full before:mb-1 hover:opacity-80 transition-opacity duration-150 active:scale-95 font-semibold" href="#">
<span class="material-symbols-outlined" data-icon="timer">timer</span>
<span class="font-caption text-caption mt-1">Focus</span>
</a>
<!-- Tab 3: Blocks -->
<a class="flex flex-col items-center justify-center text-text-tertiary pt-2.5 hover:opacity-80 transition-opacity duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="shield">shield</span>
<span class="font-caption text-caption mt-1">Blocks</span>
</a>
<!-- Tab 4: Insights -->
<a class="flex flex-col items-center justify-center text-text-tertiary pt-2.5 hover:opacity-80 transition-opacity duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-caption text-caption mt-1">Insights</span>
</a>
<!-- Tab 5: Profile -->
<a class="flex flex-col items-center justify-center text-text-tertiary pt-2.5 hover:opacity-80 transition-opacity duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-caption text-caption mt-1">Profile</span>
</a>
</nav>
<!-- iOS Home Indicator bar -->
<div class="fixed bottom-1.5 left-1/2 -translate-x-1/2 w-[134px] h-[5px] bg-text-primary/20 rounded-full z-50 pointer-events-none"></div>
</div>
<script>
    // Micro-interactions for Mode Switcher
    const timerBtn = document.getElementById('mode-timer');
    const stopwatchBtn = document.getElementById('mode-stopwatch');

    if (timerBtn && stopwatchBtn) {
      timerBtn.addEventListener('click', () => {
        timerBtn.className = 'flex-1 bg-primary-container text-surface font-label text-label font-semibold rounded-full py-1.5 text-center shadow-sm transition-all duration-200';
        stopwatchBtn.className = 'flex-1 text-text-secondary font-label text-label font-medium rounded-full py-1.5 text-center hover:text-text-primary transition-all duration-200';
      });

      stopwatchBtn.addEventListener('click', () => {
        stopwatchBtn.className = 'flex-1 bg-primary-container text-surface font-label text-label font-semibold rounded-full py-1.5 text-center shadow-sm transition-all duration-200';
        timerBtn.className = 'flex-1 text-text-secondary font-label text-label font-medium rounded-full py-1.5 text-center hover:text-text-primary transition-all duration-200';
      });
    }
  </script>
</body></html>
