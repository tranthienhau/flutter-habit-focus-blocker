<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    /* Smooth pulsating aura around timer */
    @keyframes subtle-pulse {
      0%, 100% { opacity: 0.22; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.03); }
    }
    .timer-aura {
      animation: subtle-pulse 6s ease-in-out infinite;
    }

<body class="bg-[#2D0A2E] text-white antialiased h-full flex justify-center items-center overflow-hidden font-body selection:bg-secondary-fixed selection:text-primary">
<!-- Mobile Viewport Frame (iPhone 393 x 852 ratio) -->
<main class="relative w-full max-w-[393px] h-full max-h-[852px] shadow-2xl flex flex-col justify-between overflow-hidden select-none bg-gradient-to-b from-[#4A154B] to-[#6B2A5E]">
<!-- Ambient Bottom Warm Gold Glow Gradient Effect -->
<div class="pointer-events-none absolute -bottom-36 left-1/2 -translate-x-1/2 w-[420px] h-[360px] rounded-full bg-[radial-gradient(circle,rgba(236,178,46,0.22)_0%,rgba(107,42,94,0)_70%)] blur-2xl"></div>
<!-- Background Subtle Aura behind ring -->
<div class="pointer-events-none absolute top-44 left-1/2 -translate-x-1/2 w-[280px] h-[280px] rounded-full bg-[radial-gradient(circle,rgba(236,178,46,0.18)_0%,rgba(74,21,75,0)_75%)] timer-aura"></div>
<!-- 1. iOS Safe Area Top & Status Bar -->
<header class="relative z-20 flex-shrink-0 w-full pt-3 px-7">
<div class="w-full flex justify-between items-center text-white/95 text-[14px] font-semibold tracking-tight h-7">
<span>9:41</span>
<div class="flex items-center space-x-2 text-[12px]">
<!-- Cellular -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.75" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.75" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.75" width="2.5" x="9" y="3"></rect>
<rect height="11.5" rx="0.75" width="2.5" x="13.5" y="0.5"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.3L16 4.1C13.9 2 11.1 0.7 8 0.7C4.9 0.7 2.1 2 0 4.1L1.2 5.3C2.9 3.6 5.3 2.5 8 2.5ZM8 6C9.7 6 11.2 6.7 12.3 7.8L13.5 6.6C12.1 5.2 10.1 4.3 8 4.3C5.9 4.3 3.9 5.2 2.5 6.6L3.7 7.8C4.8 6.7 6.3 6 8 6ZM8 9.5C6.9 9.5 6 10.4 6 11.5C6 11.8 6.1 12 6.2 12H9.8C9.9 12 10 11.8 10 11.5C10 10.4 9.1 9.5 8 9.5Z"></path>
</svg>
<!-- Battery with pill outline and fill -->
<div class="flex items-center space-x-0.5">
<div class="w-6 h-3 border border-white/80 rounded-[4px] p-[1.5px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-0.5 h-1.5 bg-white/70 rounded-r-sm"></div>
</div>
</div>
</div>
</header>
<!-- 2. Top Navigation Bar (Shared Component Style Mapping) -->
<!-- JSON: small_center_aligned, headline: "Deep Work", leading_icon: "close", trailing_icon: "more_horiz" -->
<nav class="relative z-20 flex justify-between items-center w-full px-5 pt-3 pb-2 max-w-[393px] mx-auto">
<!-- Leading Icon: Close / Minimize 'X' -->
<button aria-label="Minimize Session" class="w-9 h-9 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-white border border-white/10" type="button">
<span class="material-symbols-outlined text-[19px]">close</span>
</button>
<!-- Center Pill: Tag & Headline mapped to Shared Component spec -->
<div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-black/20 backdrop-blur-md border border-white/10 shadow-sm">
<span class="w-2 h-2 rounded-full bg-[#ECB22E] animate-pulse"></span>
<span class="font-label text-label tracking-wide text-white/95 font-medium">Deep Work</span>
</div>
<!-- Trailing Icon: More options / Ambient audio control -->
<button aria-label="Session options" class="w-9 h-9 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-white border border-white/10" type="button">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</nav>
<!-- 3. Primary Focal Canvas: 25% Ring Timer + Numerals -->
<section class="relative z-10 flex flex-col items-center justify-center px-6 mt-1 mb-2">
<div class="relative w-[246px] h-[246px] flex items-center justify-center">
<!-- SVG Radial Progress -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 240 240">
<!-- Background Inactive Track: 15% subtle warm translucent -->
<circle cx="120" cy="120" fill="transparent" r="104" stroke="rgba(255, 255, 255, 0.14)" stroke-width="7"></circle>
<!-- Active Progress Stroke: Exactly 25% completed (2*PI*104 = 653.45; stroke-dashoffset = 653.45 * 0.75 = 490.08) -->
<circle class="transition-all duration-700 ease-out" cx="120" cy="120" fill="transparent" r="104" stroke="#ECB22E" stroke-dasharray="653.45" stroke-dashoffset="490.08" stroke-linecap="round" stroke-width="7.5"></circle>
</svg>
<!-- Center Counter Content -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center select-none pt-1">
<!-- Glow indicator badge -->
<span class="text-[11px] uppercase tracking-widest font-caption text-[#ECB22E] font-semibold mb-1 opacity-90">Focusing</span>
<!-- Gloock Display Numerals -->
<h1 class="font-display text-[58px] leading-[62px] text-white tracking-tight drop-shadow-sm">
            18:42
          </h1>
<!-- Subtext Target -->
<p class="font-caption text-caption text-white/70 font-medium tracking-normal mt-1">
            of 25:00
          </p>
</div>
</div>
</section>

<!-- Blocked Badges List -->
<div class="flex flex-wrap gap-1.5 pt-1">

<span class="w-1.5 h-1.5 rounded-full bg-rose-400/80"></span>
<span>Instagram</span>
</span>
<span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-black/20 text-white/85 text-[12px] font-label border border-white/10">
<span class="w-1.5 h-1.5 rounded-full bg-cyan-300/80"></span>
<span>TikTok</span>
</span>
<span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-black/20 text-white/85 text-[12px] font-label border border-white/10">
<span class="w-1.5 h-1.5 rounded-full bg-white/70"></span>
<span>X</span>
</span>
<span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-black/20 text-white/85 text-[12px] font-label border border-white/10">
<span class="w-1.5 h-1.5 rounded-full bg-red-500/80"></span>

</span>

<!-- 5. Bottom Action Controls & iOS Home Indicator -->
<!-- BottomNavBar and FAB are strictly suppressed as specified -->
<footer class="relative z-20 w-full px-5 pt-3 pb-8 flex flex-col items-center space-y-2.5">
<!-- Primary CTA: Crisp White Pill Button with Aubergine Bold Lato Text -->
<button class="w-full py-3.5 px-6 rounded-full bg-white hover:bg-neutral-100 active:scale-[0.98] transition-all duration-150 shadow-md flex items-center justify-center space-x-2 text-[#4A154B] font-title text-[16px] font-bold tracking-tight cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: 'FILL' 1;">pause</span>
<span>Pause</span>
</button>
<!-- Secondary CTA: Outline White Pill Button -->
<button class="w-full py-3.5 px-6 rounded-full bg-transparent border border-white/35 hover:bg-white/10 active:scale-[0.98] transition-all duration-150 flex items-center justify-center space-x-2 text-white font-label text-[15px] font-medium tracking-normal cursor-pointer" type="button">
<span>End session</span>
</button>
<!-- iOS Home Indicator Pill Clearance (~34px buffer) -->
<div class="pt-2">
<div class="w-32 h-1 bg-white/40 rounded-full mx-auto"></div>
</div>
</footer>
</main>
<!-- Interactive Lightweight State Controller -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle Pause/Resume button state
      const pauseBtn = document.querySelector('button:has(span:contains("Pause")), button:has(span.material-symbols-outlined)');
      let isPaused = false;

      // Handle pause interaction
      document.querySelectorAll('button').forEach(btn => {
        if (btn.innerText.includes('Pause')) {
          btn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
              btn.innerHTML = `
                <span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                <span>Resume</span>
              `;
            } else {
              btn.innerHTML = `
                <span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: 'FILL' 1;">pause</span>
                <span>Pause</span>
              `;
            }
          });
        }
      });
    });
  </script>
