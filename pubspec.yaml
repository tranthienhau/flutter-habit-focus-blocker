name: anchor
description: "Anchor - habit tracker, Screen Time app blocker and focus timer for iOS (Android-ready)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^4.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon.png"
  remove_alpha_ios: true
